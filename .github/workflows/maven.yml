name: UI Test Automation Workflow

on:
  schedule:
    - cron: '0 18 * * *'
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  run-ui-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven

      - name: Running Test Automation Framework with Maven
        run: mvn clean test -X -DsuiteXmlFile=testng.xml -Dbrowser=chrome -DisLambdaTest=true -DisHeadless=true

      - name: Upload Test Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Test Logs
          path: logs/

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Test Reports
          path: report.html

      - name: Test Execution Status
        run: echo "Test Execution Completed"

      - name: Copy reports to gh-pages folder
        if: always()
        run: |
         mkdir -p public/extent-reports
         cp -R index.html public/extent-reports
         cp -R screenshots/ public/extent-reports/screenshots
         ls -l

      - name: Deploy
        if: always()
        uses: peaceiris/actions-gh-pages@v4.1.0
        with:
         folder: public/extent-reports
         token: ${{ secrets.GITHUB_TOKEN }}
         clean: true
